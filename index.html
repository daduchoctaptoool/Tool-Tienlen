function seatBaseLayout(count){
  // Thứ tự mảng = thứ tự lượt đánh: Bạn → Phải → Đối diện → Trái → (quay lại Bạn)
  if(count===2) return [{id:'you',label:'Bạn',pos:'bottom'},{id:'p1',label:'Đối thủ',pos:'top'}];
  if(count===3) return [{id:'you',label:'Bạn',pos:'bottom'},{id:'p1',label:'Phải',pos:'right'},{id:'p2',label:'Trái',pos:'left'}];
  return [{id:'you',label:'Bạn',pos:'bottom'},{id:'p1',label:'Phải',pos:'right'},{id:'p2',label:'Đối diện',pos:'top'},{id:'p3',label:'Trái',pos:'left'}];
}

function render(){
  const app=document.getElementById('app');
  let html = '';
  if(state.phase==='setup') html = renderSetup();
  else if(state.phase==='draft') html = renderDraft();
  else if(state.phase==='play') html = renderPlay();
  else if(state.phase==='finished') html = renderFinished();
  html += renderCredit();
  app.innerHTML = html;
}

function toggleDraft(id){
  if(state.draftSelected.has(id)){
    state.draftSelected.delete(id);
    state.draftError = null;
  } else {
    if(state.draftSelected.size>=13){
      state.draftError = "Bạn chỉ được chọn tối đa 13 lá.";
      render();
      return;
    }
    state.draftSelected.add(id);
    state.draftError = null;
  }
  render();
}
function stepOpp(id,delta){
  const seat = state.seats.find(s=>s.id===id);
  seat.count = Math.max(0, Math.min(13, seat.count+delta));
  render();
}
function backToSetup(){state.phase='setup'; render();}

function confirmDraft(){
  state.yourHand = [...state.draftSelected].map(cardById).sort((a,b)=>a.power-b.power);
  const youSeat = state.seats.find(s=>s.id==='you');
  youSeat.count = state.yourHand.length;
  youSeat.startCount = state.yourHand.length;
  youSeat.hiddenHand = null; // 'you' luôn dùng state.yourHand, không cần lưu riêng

  const otherSeats = state.seats.filter(s=>s.id!=='you');
  if(state.gameMode==='bot'){
    // Chế độ đấu Bot: tự động chia bài thật cho từng bot (ẩn với người chơi) + gán ngẫu nhiên
    // lối chơi theo độ khó đã chọn.
    const usedIds = new Set(state.yourHand.map(c=>c.id));
    let pool = buildFullDeck().filter(c=>!usedIds.has(c.id));
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const cfg = BOT_DIFFICULTY[state.botDifficulty] || BOT_DIFFICULTY.easy;
    const allStyleKeys = Object.keys(AI_PLAYSTYLES);
    let idx=0;
    otherSeats.forEach(s=>{
      const take = Math.min(13, pool.length-idx);
      s.hiddenHand = pool.slice(idx, idx+take);
      idx += take;
      s.count = s.hiddenHand.length;
      s.startCount = s.count;
      const [minS,maxS] = cfg.styleCount;
      const n = Math.max(1, Math.min(allStyleKeys.length, minS + Math.floor(Math.random()*(maxS-minS+1))));
      const shuffled = [...allStyleKeys].sort(()=>Math.random()-0.5);
      s.botStyles = shuffled.slice(0, n);
      s.botStyleProfile = getStyleWeightProfile(s.botStyles);
    });
  } else {
    otherSeats.forEach(s=>{ s.startCount = s.count; s.hiddenHand = null; s.botStyles = null; s.botStyleProfile = null; });
  }

  state.history = [];
  state.turnOrder = rotateToStart(state.seats.map(s=>s.id), state.startSeatId);
  state.turnIndex = 0;
  state.tableOwner = state.turnOrder[0];
  state.lastPlay = null;
  state.playSelected = new Set();
  state.oppSelected = new Set();
  state.rankOrder = [];
  state.undoStack = [];
  state.playerLog = {};
  state.seats.forEach(s=>{ if(s.id!=='you') state.playerLog[s.id]=[]; });
  state.showInference = false;
  state.aiResult = null; state.aiError = null; state.aiLoading = false; state.aiWhyExpanded = false; state.aiProgress = null;
  state.aiDeterminizationCache = {key:null, set:new Set()};
  state.botThinking = false;
  state.passStreak = 0;
  state.log = [`Bắt đầu ván. ${seatLabel(state.startSeatId)} đánh trước.`];
  state.phase='play';
  render();
}
function rotateToStart(order, startId){
  const idx = order.indexOf(startId);
  return [...order.slice(idx), ...order.slice(0,idx)];
}
function seatLabel(id){const s=state.seats.find(x=>x.id===id); return s?s.label:id;}

/* ---------------- UNDO ---------------- */
function snapshotState(){
  return {
    seats: state.seats.map(s=>({...s})),
    turnIndex: state.turnIndex,
    tableOwner: state.tableOwner,
    lastPlay: state.lastPlay ? {type:state.lastPlay.type, power:state.lastPlay.power, cardIds:state.lastPlay.cards.map(c=>c.id)} : null,
    history: state.history.map(c=>c.id),
    yourHand: state.yourHand.map(c=>c.id),
    rankOrder: [...state.rankOrder],
    log: [...state.log],
    phase: state.phase,
    playerLog: JSON.parse(JSON.stringify(state.playerLog)),
    passStreak: state.passStreak,
  };
}
function pushUndo(){
  state.undoStack.push(snapshotState());
  if(state.undoStack.length>20) state.undoStack.shift();
}
function undoLastMove(){
  if(state.undoStack.length===0) return;
  const snap = state.undoStack.pop();
  state.seats = snap.seats.map(s=>({...s}));
  state.turnIndex = snap.turnIndex;
  state.tableOwner = snap.tableOwner;
  state.lastPlay = snap.lastPlay ? {type:snap.lastPlay.type, power:snap.lastPlay.power, cards:snap.lastPlay.cardIds.map(cardById)} : null;
  state.history = snap.history.map(cardById);
  state.yourHand = snap.yourHand.map(cardById).sort((a,b)=>a.power-b.power);
  state.rankOrder = [...snap.rankOrder];
  state.log = [...snap.log, "↺ Đã lùi lại thao tác trước."];
  state.phase = snap.phase;
  state.playerLog = snap.playerLog;
  state.passStreak = snap.passStreak||0;
  state.playSelected = new Set();
  state.oppSelected = new Set();
  state.playError = null;
  state.oppError = null;
  render();
}

/* ---------------- PLAY ---------------- */
function currentSeat(){
  let tries=0;
  while(tries < state.turnOrder.length*2){
    const id = state.turnOrder[state.turnIndex % state.turnOrder.length];
    const seat = state.seats.find(s=>s.id===id);
    if(!seat.finished) return seat;
    state.turnIndex++;
    tries++;
  }
  return null;
}
function unknownDeck(){
  const known = new Set([...state.yourHand, ...state.history].map(c=>c.id));
  return buildFullDeck().filter(c=>!known.has(c.id));
}
function isFreeLead(seatId){ return seatId === state.tableOwner; }

function computeSuggestion(){
  const key = gameAnalysisFingerprint();
  if(_suggestionCache.key===key) return _suggestionCache.value;
  const seat = currentSeat();
  if(!seat || seat.id!=='you') return null; // không cache trường hợp rỗng (không phải lượt bạn)
  const free = isFreeLead('you');
  const hand = new Hand(state.yourHand);
  const opponents = state.seats.filter(s=>s.id!=='you'&&!s.finished).map(s=>{
    const inf = inferOpponent(s.id);
    return {name:s.label, count:s.count, provenNoBomb: inf.noQuad && inf.noThreePair && inf.noFourPair};
  });
  const unk = unknownDeck();
  const pigSafety = evaluatePigSafety(unk, opponents, state.bombSuspect);
  const gs = {holder: free?'you':'opp', lastPlay: free?null:state.lastPlay, opponents, historyCount: state.history.length};
  const move = selectBestMove(hand, gs, pigSafety);
  const value = {move, pigSafety};
  _suggestionCache = {key, value};
  return value;
}

// Cập nhật thanh tiến trình trực tiếp trên DOM (không render lại toàn bộ trang) để
// vòng lặp mô phỏng chạy nhanh hơn nhiều, nhất là ở chế độ "Sâu"/"Cực sâu" trên điện thoại.
function updateAIProgressDOM(p){
  const txt = document.getElementById('aiProgressText');
  const pctEl = document.getElementById('aiProgressPct');
  const bar = document.getElementById('aiProgressBar');
  const sample = document.getElementById('aiProgressSample');
  if(!txt || !pctEl || !bar) return false; // panel chưa có trên DOM -> cần render lại toàn bộ 1 lần

  txt.textContent = `Đang tính biến thể ${p.current}/${p.total}`;
  pctEl.textContent = pct + '%';

}

function renderAIResult(result){
  const sims = [...result.simResults].sort((a,b)=>{
    if(a.pruned!==b.pruned) return a.pruned?1:-1; // phương án bị loại sớm luôn xếp cuối
    return b.avgScore-a.avgScore;
  });
  const activeSims = sims.filter(s=>!s.pruned);
  const maxScore = Math.max(...activeSims.map(s=>s.avgScore), 1);
  const minScore = Math.min(...activeSims.map(s=>s.avgScore), 0);
  const range = Math.max(1, maxScore-minScore);
  const syn = result.synthesis;
  const prunedCount = sims.filter(s=>s.pruned).length;

  return `
    <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(212,175,106,0.2);">
      <div style="font-size:12px;color:rgba(242,234,217,0.55);margin-bottom:6px;">Đã mô phỏng ${result.iterations} biến thể (tối đa ${result.maxPlies} lượt/biến thể), cho ${sims.length} phương án${prunedCount?` — loại sớm ${prunedCount} phương án chắc chắn thua để tập trung phân tích sâu phần còn lại`:''}:</div>
      ${sims.map(s=>{
        const label = s.combo.type==='PASS' ? 'Bỏ lượt' : s.combo.cards.map(c=>c.display).join(' ');
        if(s.pruned){
          return `<div style="margin-bottom:7px;opacity:0.55;">
            <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:2px;">
              <span>${label} <span class="pill danger" style="margin-left:6px;">loại sớm</span></span>
              <span style="color:rgba(242,234,217,0.5);">${s.runs} biến thể</span>
            </div>
            <div style="font-size:10.5px;color:rgba(242,234,217,0.45);font-style:italic;">${s.pruneReason||'Ngừng phân tích sâu — kém hẳn phương án dẫn đầu.'}</div>
          </div>`;
        }
        const pct = Math.round(((s.avgScore-minScore)/range)*100);
        return `<div style="margin-bottom:7px;">
          <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:2px;">
            <span>${label}</span>
            <span style="color:var(--gold-bright);">${pct}%${s.chopRate>0?` · nguy cơ bị chặt ${Math.round(s.chopRate*100)}%`:''}${s.finishRate>0?` · về đích ${Math.round(s.finishRate*100)}%`:''}${s.winRate>0?` · về Nhất ${Math.round(s.winRate*100)}%`:''}</span>
          </div>
          <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;">
            <div style="height:100%;width:${Math.max(4,pct)}%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));"></div>
          </div>
        </div>`;
      }).join('')}

      <div style="margin-top:12px;background:rgba(160,130,230,0.1);border:1px solid rgba(160,130,230,0.4);border-radius:8px;padding:12px 14px;">
        <div style="font-weight:700;color:#cdb9f5;font-size:13.5px;margin-bottom:6px;">🧠 ${syn.headline}</div>
        <div style="cursor:pointer;color:var(--gold-bright);font-size:12px;margin-bottom:6px;" onclick="toggleAIWhy()">${state.aiWhyExpanded?'▲ Ẩn lý do chi tiết':'▼ Vì sao lại vậy? (xem suy luận)'}</div>
        ${state.aiWhyExpanded ? `<div style="font-size:13px;line-height:1.7;color:rgba(242,234,217,0.85);margin-bottom:10px;">${syn.why}</div>` : ''}
        <button class="btn-suggest" style="width:100%;padding:10px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer;" onclick="useAISuggestion()">✦ Dùng gợi ý AI này</button>
      </div>
    </div>
  `;
}
function selectCandidate(i){
  const cands = window._lastCandidates || [];
  if(!cands[i]) return;
  state.playSelected = new Set(cands[i].combo.cards.map(c=>c.id));
  state.playError = null;
  render();
}
function togglePlaySelect(id){
  if(state.playSelected.has(id)) state.playSelected.delete(id);
  else state.playSelected.add(id);
  state.playError = null;
  render();
}
function useSuggestion(){
  const sug = computeSuggestion();
  state.playError = null;
  if(!sug.move.combo){ state.playSelected=new Set(); render(); return; }
  state.playSelected = new Set(sug.move.combo.cards.map(c=>c.id));
  render();
}
function playSelected(){
  const played = [...state.playSelected].map(id=>state.yourHand.find(c=>c.id===id)).filter(Boolean);
  if(played.length===0) return;
  const free = isFreeLead('you');
  const validation = validateMove(played, free, state.lastPlay);
  if(!validation.valid){
    state.playError = validation.reason;
    render();
    return;
  }
  state.playError = null;
  const combo = validation.combo;
  pushUndo();
  state.yourHand = state.yourHand.filter(c=>!state.playSelected.has(c.id));
  state.history.push(...played);
  state.lastPlay = combo;
  state.tableOwner = 'you';
  state.passStreak = 0;
  const youSeat = state.seats.find(s=>s.id==='you');
  youSeat.count = state.yourHand.length;
  state.log.push(`Bạn đánh ${comboLabel(combo.type)}: ${played.map(c=>c.display).join(' ')}`);
  state.playSelected = new Set();
  if(youSeat.count===0){ youSeat.finished=true; state.rankOrder.push('you'); state.log.push('Bạn đã về!'); }
  advanceTurn();
}
function passTurn(){
  if(isFreeLead('you')){ state.playError = 'Đang giữ cái tự do — bắt buộc phải ra bài, không được bỏ lượt.'; render(); return; }
  pushUndo();
  state.log.push(`Bạn bỏ lượt.`);
  state.passStreak++;
  advanceTurn();
}

function renderOppTurn(seat, free){
  const unk = unknownDeck();
  const bySuit = {}; SUITS.forEach(s=>bySuit[s]=unk.filter(c=>c.suit===s));
  const maxSelectable = seat.count;
  const selCount = state.oppSelected.size;

  return `
    <div class="panel opp-picker">
      <h2 class="step-title" style="margin-bottom:4px;"><span class="num">🂠</span>${seat.label} đánh gì?</h2>
      <div class="hint">${free ? `Đang giữ cái tự do — <b>bắt buộc phải ra bài</b>, không được bỏ lượt.` : `Bấm chọn các lá ${seat.label} vừa đánh ra (tối đa ${maxSelectable} lá).`}</div>
      ${SUITS.map(s=>bySuit[s].length?`
        <div class="suit-row">
          <div class="suit-label">${SUIT_SYMBOL[s]} ${SUIT_NAME[s]}</div>
          <div class="card-grid">
            ${bySuit[s].map(c=>{
              const sel = state.oppSelected.has(c.id);
              const disabled = !sel && selCount>=maxSelectable;
              return `<div class="pickcard ${c.isRed?'red':''} ${sel?'selected':''} ${disabled?'used':''}" onclick="${disabled?'':`toggleOppSelect('${c.id}')`}">${c.rank}<span class="suit-ic">${SUIT_SYMBOL[c.suit]}</span></div>`;
            }).join('')}
          </div>
        </div>
      `:'').join('')}
      <div class="counter-line">Đã chọn: <b>${selCount}</b> / ${maxSelectable}</div>
      <div class="action-row">
        <button class="btn-play" ${selCount>0?'':'disabled'} onclick="confirmOppPlay('${seat.id}')">Xác nhận đánh (${selCount})</button>
        <button class="btn-pass" ${free?'disabled':''} onclick="oppPass('${seat.id}')">Bỏ lượt${free?' (không thể — đang tự do)':''}</button>
      </div>
      ${state.oppError?`<div class="err-line">${state.oppError}</div>`:''}
    </div>
  `;
}
function toggleOppSelect(id){
  if(state.oppSelected.has(id)) state.oppSelected.delete(id);
  else state.oppSelected.add(id);
  state.oppError = null;
  render();
}
function confirmOppPlay(seatId){
  const seat = state.seats.find(s=>s.id===seatId);
  const played = [...state.oppSelected].map(cardById);
  if(played.length===0) return;
  const free = isFreeLead(seatId);
  const facedCombo = free ? null : state.lastPlay;
  const validation = validateMove(played, free, state.lastPlay);
  if(!validation.valid){
    state.oppError = validation.reason;
    render();
    return;
  }
  state.oppError = null;
  const combo = validation.combo;
  pushUndo();
  state.history.push(...played);
  seat.count = Math.max(0, seat.count - played.length);
  state.lastPlay = combo;
  state.tableOwner = seatId;
  state.passStreak = 0;
  state.log.push(`${seat.label} đánh ${comboLabel(combo.type)}: ${played.map(c=>c.display).join(' ')}`);
  if(!state.playerLog[seatId]) state.playerLog[seatId]=[];
  state.playerLog[seatId].push({
    kind:'play', cards:played.map(c=>c.id), comboType:combo.type, comboLen:combo.cards.length, comboPower:combo.power,
    facedFree:free, facedComboType: facedCombo?facedCombo.type:null, facedComboLen: facedCombo?facedCombo.cards.length:null, facedComboPower: facedCombo?facedCombo.power:null,
  });
  state.oppSelected = new Set();
  if(seat.count===0){ seat.finished=true; state.rankOrder.push(seatId); state.log.push(`${seat.label} đã về!`); }
  advanceTurn();
}
function oppPass(seatId){
  const seat = state.seats.find(s=>s.id===seatId);
  const free = isFreeLead(seatId);
  if(free){ state.oppError = 'Đang giữ cái tự do — bắt buộc phải ra bài, không được bỏ lượt.'; render(); return; }
  pushUndo();
  state.log.push(`${seat.label} bỏ lượt.`);
  state.passStreak++;
  if(!free && state.lastPlay){
    if(!state.playerLog[seatId]) state.playerLog[seatId]=[];
    state.playerLog[seatId].push({
      kind:'pass', facedComboType: state.lastPlay.type, facedComboLen: state.lastPlay.cards.length, facedComboPower: state.lastPlay.power,
    });
  }
  state.oppSelected = new Set();
  advanceTurn();
}

function advanceTurn(){
  state.playError = null;
  state.oppError = null;
  state.aiResult = null;
  state.aiError = null;
  state.aiWhyExpanded = false;
  state.aiProgress = null;
  state.aiRunToken = (state.aiRunToken||0) + 1; // huỷ mọi vòng tính Siêu Gợi Ý AI còn dở dang từ lượt trước
  const remaining = state.seats.filter(s=>!s.finished);
  if(remaining.length<=1){
    remaining.forEach(s=>{ if(!state.rankOrder.includes(s.id)) state.rankOrder.push(s.id); });
    state.phase='finished';
    render();
    return;
  }
  state.turnIndex++;
  // Bỏ qua các ghế đã về để tìm người tới lượt kế tiếp.
  let guard = state.turnOrder.length*2 + 5;
  while(guard-- > 0){
    const id = state.turnOrder[state.turnIndex % state.turnOrder.length];
    const s = state.seats.find(x=>x.id===id);
    if(s && s.finished){ state.turnIndex++; continue; }
    break;
  }
  const nextId = state.turnOrder[state.turnIndex % state.turnOrder.length];

  // ============================================================
  // Xác định "trick" hiện tại đã NGÃ NGŨ hay chưa — dựa trực tiếp vào SỐ LƯỢT BỎ LIÊN TIẾP
  // kể từ lần ra bài thành công gần nhất (state.passStreak), KHÔNG dựa vào so khớp vị trí
  // như trước (dễ sai khi chủ bài đã về giữa chừng, khiến việc so khớp không bao giờ đúng
  // hoặc ngược lại yêu cầu nhiều lượt bỏ hơn mức thật sự cần thiết).
  //   - Nếu chủ bài còn đang chơi: cần đúng (số người còn lại - 1) lượt bỏ từ những người khác.
  //   - Nếu chủ bài đã về: cần đúng (số người còn lại) lượt bỏ, vì không ai được miễn cả.
  // Ngã ngũ xong: chủ bài (nếu còn) được cầm cái tự do lại; nếu chủ bài đã về thì người tới
  // lượt kế tiếp (đã bỏ qua các ghế đã về) cầm cái tự do thay.
  // ============================================================
  const activeSeats = state.seats.filter(s=>!s.finished);
  const ownerSeat = state.seats.find(s=>s.id===state.tableOwner);
  const ownerStillActive = !!(ownerSeat && !ownerSeat.finished);
  const neededPasses = activeSeats.length - (ownerStillActive ? 1 : 0);

  if(neededPasses<=0 || state.passStreak>=neededPasses){
    const freeOwnerId = ownerStillActive ? state.tableOwner : nextId;
    state.tableOwner = freeOwnerId;
    state.lastPlay = null;
    state.passStreak = 0;
    state.turnIndex = state.turnOrder.indexOf(freeOwnerId);
    state.log.push(`✅ Không ai chặn được — ${seatLabel(freeOwnerId)} được cầm cái mới, ra bài tự do.`);
  }
  render();
}

/* ---------------- FINISHED ---------------- */
function renderFinished(){
  let order = state.rankOrder.length ? [...state.rankOrder] : state.seats.map(s=>s.id);
  // đảm bảo mọi ghế đều có mặt trong bảng xếp hạng (phòng trường hợp game kết thúc đột ngột)
  state.seats.forEach(s=>{ if(!order.includes(s.id)) order.push(s.id); });

  // Luật "thua trắng": nếu ai đó về Nhất mà có người vẫn còn nguyên số lá lúc chia bài
  // (chưa từng đánh được lá nào) — người đó bị đẩy xuống hạng BÉT tuyệt đối, bất kể vị trí
  // tính theo số lá còn lại là gì.
  const whiteoutIds = new Set();
  state.seats.forEach(s=>{
    if(s.startCount && s.count===s.startCount && order[0]!==s.id){
      whiteoutIds.add(s.id);
    }
  });
  if(whiteoutIds.size){
    const rest = order.filter(id=>!whiteoutIds.has(id));
    order = [...rest, ...order.filter(id=>whiteoutIds.has(id))];
  }

  const labels = ['🥇 Nhất','🥈 Nhì','🥉 Ba','🍗 Tư'];
  return `
    <header>
      <div class="eyebrow">Master Algorithm Engine</div>
      <h1>Kết thúc ván</h1>
      <div class="sub">Bảng xếp hạng</div>
    </header>
    <div class="panel">
      ${order.map((id,i)=>{
        const s = state.seats.find(x=>x.id===id);
        const isWhiteout = whiteoutIds.has(id);
        return `<div class="final-rank">${labels[i]||('#'+(i+1))}: <b>${seatLabel(id)}</b>${isWhiteout?' <span class="pill danger">🫥 Thua trắng — chưa đánh lá nào</span>':''}</div>`;
      }).join('')}
    </div>
    ${state.gameMode==='bot' ? renderBotReveal() : ''}
    <button class="primary" onclick="backToSetup()">Ván mới</button>
  `;
}

function renderBotReveal(){
  const botSeats = state.seats.filter(s=>s.id!=='you');
  return `
    <div class="panel">
      <h2 class="step-title" style="margin-bottom:8px;"><span class="num">🤖</span>Tiết lộ Bot</h2>
      ${botSeats.map(s=>{
        const styles = (s.botStyles||[]).map(k=>AI_PLAYSTYLES[k] ? `<span class="tactic-tag">${AI_PLAYSTYLES[k].icon} ${AI_PLAYSTYLES[k].label}</span>` : '').join('');
        const remaining = s.hiddenHand || [];
        return `
          <div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(212,175,106,0.15);">
            <div style="font-weight:700;color:var(--gold-bright);font-size:13.5px;margin-bottom:5px;">${s.label}</div>
            <div style="font-size:12px;color:rgba(242,234,217,0.55);margin-bottom:4px;">Lối chơi đã dùng (${(s.botStyles||[]).length}):</div>
            <div style="margin-bottom:8px;">${styles || '<span class="hint">—</span>'}</div>
            <div style="font-size:12px;color:rgba(242,234,217,0.55);margin-bottom:4px;">Bài còn lại lúc kết thúc (${remaining.length} lá):</div>
            <div>${remaining.length ? remaining.map(c=>`<span class="minicard ${c.isRed?'red':''}" style="display:inline-flex;margin:0 3px 3px 0;">${c.display}</span>`).join('') : '<span class="hint">Đã đánh hết — về đích trọn vẹn.</span>'}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

render();
</script>
</body>
</html>
